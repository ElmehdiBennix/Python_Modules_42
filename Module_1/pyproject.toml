[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "module-1"
version = "0.1.0"
description = "Array manipulation and working with images"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "pillow>=12.3.0",
]

[project.scripts]
# The 42 norminette is flake8. This exposes it as `uv run norminette`.
norminette = "flake8.main.cli:main"

[dependency-groups]
dev = [
    "black>=24.10.0",
    "flake8>=7.3.0",
]

[tool.hatch.build.targets.wheel]
# The exercises are standalone scripts, not an importable package.
bypass-selection = true

[tool.black]
# 79 characters keeps black compatible with the flake8 norm.
line-length = 79
target-version = ["py310"]
